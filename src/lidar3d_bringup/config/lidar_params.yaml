# ==============================================================================
# LiDAR 3D Perception Parameter Configuration
# ==============================================================================
# 用途: 统一管理感知算法参数，方便团队调参和实车标定
# 修改后重启节点生效，无需重新编译
#
# 参数调优指南见文档: ~/文档/sumOflidarProject.md 第五章
# ==============================================================================

# ------------------------------------------------------------------------------
# 传感器硬件参数 (仅用于文档参考，不被ROS节点读取)
# ------------------------------------------------------------------------------
# sensor:
#   type: "lslidar_c16"
#   height: 1.5  (实车标定后修改)
#   tf_x: 0.5
#   tf_y: 0.0
#   tf_z: 1.5
#   ring_field_name: "ring"  (TODO: 拿到LSLidar C16后确认)
#   use_native_ring: true
#   num_rings: 16
#   vertical_fov_min: -15.0
#   vertical_fov_max: 15.0
#   horizontal_resolution: 0.2
#   frame_rate: 10


# ------------------------------------------------------------------------------
# 点云预处理 (pointcloud_filter节点)
# ------------------------------------------------------------------------------
pointcloud_filter:
  ros__parameters:
    # 距离过滤
    max_range: 30.0                  # 最大距离 (m). 16线建议≤25m, >30m点云过于稀疏
    min_range: 0.1                   # 最小距离 (m), 过滤自身反射点

    # 高度过滤
    min_height: -3.0                 # 最低高度 (m), 负值=传感器下方
    max_height: 5.0                  # 最高高度 (m)

    # 角度过滤 (方向性感知)
    angle_limit_deg: 135.0           # 水平半角限制 (度)
                                     # 135°=保留前方±135°(去后方90°)
                                     # 180°=全向360°扫描


# ------------------------------------------------------------------------------
# 地面分割 (Patchwork++)
# ------------------------------------------------------------------------------
# Patchwork++的参数在其自己的配置文件中
# 位置: src/patchwork-plusplus/config/params.yaml
# 这里仅做引用标记，实际参数见上述文件


# ------------------------------------------------------------------------------
# 曲面检测器 (surface_detector节点) — 主力算法
# ------------------------------------------------------------------------------
surface_detector:
  ros__parameters:
    # ==== 曲面模型 (Layer 1) ====
    grid_dr_base: 0.10               # 径向基础分辨率 (m)
    grid_dr_per_m: 0.02              # 径向分辨率增长率 (m/m)
    grid_dth_deg: 1.5                # 角度分辨率 (度)

    # 曲面平滑参数
    smooth_sigma: 1.2                # 高斯平滑σ (格数)
                                     # ↑ = 曲面更平滑，小突起残差更大
                                     # 推荐范围: 0.5-2.0

    # ==== 残差分析 (Layer 2) ====
    residual_th_near: 0.15           # 近处(5m)障碍物高度阈值 (m)
    residual_th_far: 0.40            # 远处(30m)障碍物高度阈值 (m)
    mad_factor: 3.0                  # MAD噪声抑制倍率 (↑=更抗噪)

    # ==== Ground离群点过滤 (方案A) ====
    # Patchwork++可能把斜面上的障碍物误分到ground，此参数控制曲面构建时
    # 剔除"高于median + k×MAD"的ground点，捕获为疑似障碍物参与检测。
    # ↓=捕获更多疑似障碍物(更敏感, 斜面上障碍物易检出), ↑=更宽松(抑制误检)
    ground_outlier_factor: 2.0

    # ==== 近场曲面NaN修复 ====
    # Patchwork++盲区(min_range=1.0) + 16线近场(<5.6m)打不到地面 → 曲面NaN。
    # 此范围内用全局地面参考填充NaN，使近场障碍物能触发检测。
    # ↑=扩大修复范围, ↓=缩小(近场可能漏检)
    nearfield_range: 6.0

    # 聚类参数
    min_cluster_pts: 8               # 最小聚类点数

    # ==== 置信度 & 发布 ====
    confidence_threshold: 0.35       # 高置信度阈值 (0-1)
    pothole_depth_m: 0.08            # 坑洼深度阈值 (m)

    # ==== 时序追踪 ====
    track_dist_thr: 2.0              # 跨帧匹配最大距离 (m)
    track_hist: 10                   # 历史帧数
    track_max_lost: 5                # 丢帧上限

    # ==== 日志输出 ====
    log_interval: 10                 # 日志输出帧间隔


# ------------------------------------------------------------------------------
# 体素分析器 (voxel_analyzer节点) — 备用对比算法
# ------------------------------------------------------------------------------
voxel_analyzer:
  ros__parameters:
    # Ring字段配置
    ring_field_name: "ring"          # 点云中ring字段名 (TODO: 确认LSLidar C16实际字段名)

    # 体素特征阈值
    edge_z_range: 0.15               # 边缘Z高差阈值 (m)
    min_pts_per_voxel: 3             # 单体素最少点数

    # 置信度
    confidence_threshold: 0.35

    # 日志
    log_interval: 10


# ------------------------------------------------------------------------------
# 障碍物适配器 (obstacle_adapter节点)
# ------------------------------------------------------------------------------
obstacle_adapter:
  ros__parameters:
    # Marker生命周期
    marker_lifetime_ms: 400          # 标记存活时间 (毫秒)

    # ==== 目标留存 (2026-08-04) ====
    # frenet_planner 是状态覆盖式(整体替换障碍物列表)且每100ms独立规划，
    # 感知抖动/遮挡的瞬时空帧会让它丢失全部障碍物。这里缓存障碍物一段时间，
    # 并以 world 系存储、发布时反算回 base_link，使车辆前进时缓存障碍物的
    # 相对位置自动正确后退（而非"粘"在原地）。
    obstacle_memory_ms: 500          # 缓存保留时长(ms). ↑=遮挡容忍强但幽灵久, ↓=反应快
    enable_dead_reckoning: true      # 位姿推算(需 world→base_link TF, 实车定位模块提供)
    world_frame: "map"               # 推算参考系
    publish_rate_hz: 20.0            # 发布频率(Hz), 独立于感知帧率保证输出连续


# ------------------------------------------------------------------------------
# 路沿分析器 (road_analyzer节点)
# ------------------------------------------------------------------------------
road_analyzer:
  ros__parameters:
    min_forward: 1.0                 # 忽略车身附近的障碍物 (m)
    max_forward: 30.0                # 前方道路边界的最大检测距离 (m)
    min_lateral: 0.75                # 忽略接近车道中心的障碍物 (m)
    forward_bin_size: 0.5            # 沿车辆前进方向的采样间隔 (m)
    min_road_width: 3.0              # 左右障碍物构成道路的最小宽度 (m)
    max_road_width: 12.0             # 左右障碍物构成道路的最大宽度 (m)
    road_width_tolerance: 1.5        # 相对中位道路宽度的允许变化 (m)
    max_lateral_step: 1.5            # 相邻 0.5m 采样的最大横向跳变 (m)
    min_points_per_side: 2           # 单个纵向采样内每侧所需最少障碍点数
    smooth_window: 5                 # 车道线中值平滑窗口
    cache_duration_ms: 2000          # 世界坐标缓存时长 (ms)
    world_frame: "map"               # 缓存参考坐标系
    publish_rate_hz: 10.0            # 独立于点云帧率的发布频率 (Hz)


# ------------------------------------------------------------------------------
# 路沿边界检测器 (boundary_detector节点) — 2026-08-03新增
# ------------------------------------------------------------------------------
boundary_detector:
  ros__parameters:
    # 极坐标分bin
    angular_resolution: 1.0          # 角度分辨率 (度)

    # 连续段判定
    gap_threshold: 1.2               # 间隙阈值 (m)

    # 路沿特征
    height_diff_threshold: 0.12      # 高度差阈值 (m)

    # 平滑
    smoothing_window: 7              # 移动平均窗口大小

    # 过滤
    min_boundary_points: 10          # 最少边界点数
    max_range: 20.0                  # 最大检测距离 (m)


# ==============================================================================
# 高级参数说明 (仅供参考，不直接使用)
# ==============================================================================
#
# 分类规则阈值 (在surface_detector.py的_classify_surface()函数中硬编码)
# 实车测试后如需调整，建议将这些阈值也提取为ROS参数
#
# classification:
#   slope_width_min: 6.0             # 坡面最小宽度 (m)
#   pole_width_max_near: 0.5         # 杆状物最大宽度@近处 (m)
#   pole_width_max_far: 0.8          # 杆状物最大宽度@远处 (m)
#   pole_height_min: 0.3             # 杆状物最小高度 (m)
#   pole_verticality_min: 0.85       # 杆状物最小垂直度 (0-1)
#   bump_height_max: 0.3             # 减速带最大高度 (m)
#   obstacle_height_min: 0.3         # 障碍物最小高度 (m)
#
# ==============================================================================


# ==============================================================================
# 场景预设 (可选)
# ==============================================================================
# 可以为不同场景创建多个配置文件，如:
#   - lidar_params.yaml          (默认/室外)
#   - lidar_params_indoor.yaml   (室内测试)
#   - lidar_params_race.yaml     (比赛场地)
#
# 使用方法:
#   ros2 launch lidar3d_bringup play_and_viz.launch.py \
#       params_file:=/path/to/lidar_params_race.yaml
# ==============================================================================
